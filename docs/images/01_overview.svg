<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="480" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">전체 파이프라인 한눈에 보기</text><rect x="40" y="70" width="300" height="64" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="190.0" y="97.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">01_data → 추출 JSONL</text><text x="190.0" y="121.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">PDF 23개 → extracted_pages.jsonl</text><rect x="450" y="70" width="300" height="64" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="600.0" y="97.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">02_questions  (질문 JSON)</text><text x="600.0" y="121.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">Agent에 들어가는 유일한 입력</text><rect x="860" y="70" width="300" height="64" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="1010.0" y="97.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">03_answers + 골든셋</text><text x="1010.0" y="121.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">평가 전용 · 검색 DB/Agent에 넣지 않음</text><path d="M 190 134 L 190 190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 600 134 L 600 190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 1010 134 L 1010 190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="190" width="300" height="130" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="190.0" y="231.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">① 인덱싱 (오프라인)</text><text x="190.0" y="255.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">추출 JSONL → parent / child 분할</text><text x="190.0" y="274.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ child 임베딩 → pgvector</text><text x="190.0" y="293.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">parent도 같은 PostgreSQL에 저장</text><rect x="450" y="190" width="300" height="130" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="600.0" y="231.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">② 질의 실행 (온라인)</text><text x="600.0" y="255.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">질문 → 오케스트레이터</text><text x="600.0" y="274.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">검색 → 평가 Agent 판단</text><text x="600.0" y="293.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ (재검색) → 답변</text><rect x="860" y="190" width="300" height="130" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="1010.0" y="231.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">③ 기록 · 평가 루프</text><text x="1010.0" y="255.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">실행 기록 PostgreSQL 저장</text><text x="1010.0" y="274.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">RAG Agent 평가 → 실패 분석</text><text x="1010.0" y="293.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 설정 개선 → 재평가</text><path d="M 340 255 L 450 255" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="395" y="245" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">인덱스</text><path d="M 750 255 L 860 255" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="805" y="245" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">실행 기록</text><path d="M 1010 320 L 1010 395 L 190 395 L 190 320" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="600" y="388" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">개선: 청킹 · 검색 · Agent 설정을 바꿔 다시 실행 (기준 설정 대비 한 번에 하나만 변경)</text><text x="600" y="440" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">임베딩은 두 시점에서만 발생: 인덱싱 때 child 청크 1회 + 검색할 때 검색어 1회 (재검색마다 추가)</text></svg>