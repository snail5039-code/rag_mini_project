<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">① 인덱싱 파이프라인 (오프라인, 설정이 바뀔 때만 다시 실행)</text><rect x="30" y="70" width="200" height="120" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="130.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">① PDF 읽기</text><text x="130.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">페이지별 텍스트 추출</text><text x="130.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">머리말·꼬리말 노이즈 점검</text><text x="130.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">file · page 기록</text><rect x="260" y="70" width="200" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="360.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">② 구조 인식</text><text x="360.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어집: 용어 단위</text><text x="360.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">약관: 제N조 단위</text><text x="360.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">가이드·추가: 제목·문단</text><rect x="490" y="70" width="200" height="120" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="590.0" y="97.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">③ Parent 분할</text><text x="590.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">구조 단위로 분할</text><text x="590.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">약관 제N조 · 가이드 소제목</text><text x="590.0" y="159.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어집은 용어 1건 (미정)</text><text x="590.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 답변 문맥으로 사용</text><rect x="720" y="70" width="200" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="820.0" y="97.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">④ Child 분할</text><text x="820.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">작은 단위 (~300자)</text><text x="820.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">제목 prefix 붙이기</text><text x="820.0" y="159.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">짧은 parent는 child와 동일</text><text x="820.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 검색 단위</text><rect x="950" y="70" width="200" height="120" rx="10" fill="#F1EAFB" stroke="#8B5CF6" stroke-width="2"/><text x="1050.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">⑤ 메타데이터 부여</text><text x="1050.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">child_id · parent_id</text><text x="1050.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">source_ids (양쪽 모두)</text><text x="1050.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">file · page · scope</text><path d="M 230 130 L 260 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 460 130 L 490 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 690 130 L 720 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 920 130 L 950 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="950" y="215" width="200" height="75" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1050.0" y="238.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">근거 ID 매핑표</text><text x="1050.0" y="262.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어명 ↔ fsc-glossary-ID</text><text x="1050.0" y="281.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">약관 파일 ↔ 약관번호·버전</text><path d="M 1050 215 L 1050 190" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><path d="M 590 190 L 590 270 L 210 270 L 210 400" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="400" y="262" font-size="12" font-weight="normal" text-anchor="middle" fill="#1F2937">parent는 임베딩하지 않고 그대로 저장</text><path d="M 820 190 L 820 310" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 820 310 L 600 310 L 600 400" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="700" y="330" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">임베딩 (child, 1회)</text><path d="M 820 310 L 990 310 L 990 400" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="905" y="330" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">Kiwi 토큰화 (실험용)</text><rect x="60" y="400" width="300" height="130" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="210.0" y="441.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">Parent 저장소 (docstore)</text><text x="210.0" y="465.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">parent 원문 + source_ids</text><text x="210.0" y="484.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">JSON / SQLite</text><text x="210.0" y="503.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">임베딩 없음 · parent_id로 조회</text><rect x="450" y="400" width="300" height="130" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="600.0" y="451.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">벡터DB (Chroma, cosine)</text><text x="600.0" y="475.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">child 청크 + 임베딩 저장</text><text x="600.0" y="494.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">기준 검색: Similarity</text><rect x="840" y="400" width="300" height="130" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="990.0" y="451.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">BM25 인덱스 (실험용)</text><text x="990.0" y="475.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">Hybrid 비교 실험에서만 사용</text><text x="990.0" y="494.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">child 형태소 토큰 · 같은 parent_id</text><text x="600" y="566" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">실험마다 collection_name을 새로 지정하고, 이미 저장된 child ID는 재임베딩하지 않습니다.</text><text x="600" y="588" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">저장 후 모든 child의 parent_id가 parent 저장소에 있는지 검증합니다.</text><text x="600" y="610" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">청킹 전략 비교 실험은 ②~④단계(구조 인식 · 분할 · prefix)를 바꾸고, 같은 source_ids로 채점합니다.</text></svg>