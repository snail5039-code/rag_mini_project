<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="660" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">① 인덱싱 파이프라인 (오프라인, 설정이 바뀔 때만 다시 실행)</text><rect x="30" y="70" width="200" height="120" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="130.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">① 추출 결과 읽기</text><text x="130.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">extracted_pages.jsonl</text><text x="130.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">(박의혁 추출 · 페이지 단위)</text><text x="130.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">file_name · page_no</text><rect x="260" y="70" width="200" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="360.0" y="97.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">② 구조 인식</text><text x="360.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어집: 용어 + 정의</text><text x="360.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">약관: 조항</text><text x="360.0" y="159.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">가이드: 소제목 + 문단</text><text x="360.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">표 · 차트: 영역 전체</text><rect x="490" y="70" width="200" height="120" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="590.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">③ Parent 분할</text><text x="590.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">② 단위가 곧 parent</text><text x="590.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어집은 parent = child 가능</text><text x="590.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 답변 문맥으로 사용</text><rect x="720" y="70" width="200" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="820.0" y="97.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">④ Child 분할</text><text x="820.0" y="121.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">~300자 · 겹침 60</text><text x="820.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">제목 prefix 붙이기</text><text x="820.0" y="159.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">짧은 parent는 child와 동일</text><text x="820.0" y="178.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 검색 단위</text><rect x="950" y="70" width="200" height="120" rx="10" fill="#F1EAFB" stroke="#8B5CF6" stroke-width="2"/><text x="1050.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">⑤ 메타데이터 부여</text><text x="1050.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">chunk_id · parent_id</text><text x="1050.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">file_name · page_no</text><text x="1050.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">chunk_method · source_ids</text><path d="M 230 130 L 260 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 460 130 L 490 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 690 130 L 720 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 920 130 L 950 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="950" y="215" width="200" height="75" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="1050.0" y="238.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">근거 ID 매핑표</text><text x="1050.0" y="262.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">용어명 ↔ fsc-glossary-ID</text><text x="1050.0" y="281.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">약관 파일 ↔ 약관번호·버전</text><path d="M 1050 215 L 1050 190" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="40" y="386" width="730" height="176" rx="14" fill="#FAFBFC" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 4"/><text x="754" y="554" font-size="13" font-weight="bold" text-anchor="end" fill="#4B5563">PostgreSQL + pgvector  (임베딩 모델·차원은 실험 전에 고정)</text><path d="M 590 190 L 590 270 L 210 270 L 210 412" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="400" y="262" font-size="12" font-weight="normal" text-anchor="middle" fill="#1F2937">parent는 임베딩하지 않고 그대로 저장</text><path d="M 820 190 L 820 320" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 820 320 L 600 320 L 600 412" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="700" y="342" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">임베딩 (child, 1회)</text><path d="M 820 320 L 990 320 L 990 412" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="868" y="342" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">읽어서 Kiwi 토큰화 (실험용)</text><rect x="60" y="412" width="300" height="130" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="210.0" y="453.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">parent_chunks 테이블</text><text x="210.0" y="477.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">parent 원문 + source_ids</text><text x="210.0" y="496.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">임베딩 없음</text><text x="210.0" y="515.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">parent_id로 조회</text><rect x="450" y="412" width="300" height="130" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="600.0" y="453.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">chunks 테이블 (pgvector)</text><text x="600.0" y="477.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">child 청크 + embedding 컬럼</text><text x="600.0" y="496.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">HNSW 인덱스 · cosine</text><text x="600.0" y="515.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">기준 검색: Vector</text><rect x="840" y="412" width="300" height="130" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="990.0" y="453.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">BM25 (실험용)</text><text x="990.0" y="477.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">PostgreSQL의 child를 읽어</text><text x="990.0" y="496.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">메모리에서 구성</text><text x="990.0" y="515.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">같은 parent_id 유지</text><text x="600" y="592" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">실험은 experiment_id · chunk_method 컬럼으로 구분하고, 이미 저장된 chunk_id는 재임베딩하지 않습니다.</text><text x="600" y="614" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">저장 후 모든 child의 parent_id가 parent_chunks에 있는지 검증합니다.</text><text x="600" y="636" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">청킹 비교: Recursive(300/500/800/1000, 겹침 60) vs Parent-Child. 같은 source_ids로 채점합니다.</text></svg>