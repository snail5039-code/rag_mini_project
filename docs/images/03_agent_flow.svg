<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="730" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">② 질의 실행 — 멀티 Agent 흐름 (문항마다 실행)</text><rect x="40" y="60" width="150" height="64" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="115.0" y="87.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">질문</text><text x="115.0" y="111.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">02_questions</text><rect x="230" y="55" width="930" height="74" rx="10" fill="#F1EAFB" stroke="#8B5CF6" stroke-width="2"/><text x="695.0" y="87.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">오케스트레이터 Agent</text><text x="695.0" y="111.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">공통 상태 · 실행 순서 · 반복 횟수(N) · 종료 조건 관리 / 모든 호출 수·토큰·시간 기록</text><path d="M 190 92 L 230 92" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="190" width="280" height="140" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="180.0" y="227.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">검색 Agent</text><text x="180.0" y="251.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">① 검색 범위(scope) 선택</text><text x="180.0" y="270.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">② 검색어 작성</text><text x="180.0" y="289.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">③ child 벡터 검색 (pgvector)</text><text x="180.0" y="308.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">④ parent_id로 parent 조회</text><rect x="400" y="190" width="240" height="140" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="520.0" y="236.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">평가 Agent</text><text x="520.0" y="260.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">검색 결과로 답할 수</text><text x="520.0" y="279.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">있는지 평가</text><text x="520.0" y="298.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 응답 유형 결정</text><path d="M 320 260 L 400 260" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="360" y="250" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">검색 결과</text><path d="M 135 129 L 135 190" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="95" y="165" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">검색 요청</text><rect x="760" y="150" width="400" height="90" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="960.0" y="181.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">충분 → 답변 Agent</text><text x="960.0" y="205.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">parent 문맥으로 한국어 답변 + 파일명·페이지 인용</text><text x="960.0" y="224.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">종료 [answer / correct]</text><rect x="760" y="255" width="400" height="66" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="960.0" y="283.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">질문이 모호함 → 되묻기</text><text x="960.0" y="307.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">종료 [clarify]</text><rect x="760" y="336" width="400" height="66" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="960.0" y="364.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">범위 밖 · 부적절 · 인젝션 → 보류 / 거절</text><text x="960.0" y="388.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">종료 [abstain / refuse]</text><rect x="760" y="417" width="400" height="66" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="960.0" y="445.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">재시도 횟수 소진 → 근거 부족 안내</text><text x="960.0" y="469.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">종료 [abstain]</text><path d="M 640 260 L 700 260 L 700 195 L 760 195" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 640 260 L 700 260 L 700 288 L 760 288" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 640 260 L 700 260 L 700 369 L 760 369" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 640 260 L 700 260 L 700 450 L 760 450" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="470" width="240" height="90" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="520.0" y="501.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">피드백 Agent</text><text x="520.0" y="525.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">부족한 근거와</text><text x="520.0" y="544.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">검색 실패 원인 분석</text><rect x="40" y="470" width="280" height="90" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="180.0" y="510.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">개선 Agent</text><text x="180.0" y="534.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">검색어 · 필터 · 검색 방식 수정</text><path d="M 520 330 L 520 470" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="610" y="408" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">부족 (재시도 남음)</text><path d="M 400 515 L 320 515" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 180 470 L 180 330" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><text x="212" y="405" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151">재검색</text><text x="600" y="610" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">재검색은 최대 N회(2~3회). 횟수를 소진하거나 같은 결과가 반복되면 평가 Agent가 '재시도 소진' 경로로 종료합니다.</text><text x="600" y="635" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">문서 본문과 질문 속의 지시문은 따르지 않도록 프롬프트에서 지시 영역과 문서 영역을 분리합니다.</text><text x="600" y="660" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">기준 검색은 Vector입니다. BM25 · Hybrid · MMR · max_parents는 비교 실험에서 하나씩 바꿉니다.</text><text x="600" y="685" font-size="13" font-weight="normal" text-anchor="middle" fill="#6B7280">미들웨어: 검색 범위 강제 · 호출 횟수 제한 · 중복 검색 차단 · 인용 검증 · 구조화 로그(PostgreSQL)</text></svg>