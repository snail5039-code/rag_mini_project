<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="690" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">③ 기록 · 평가 루프 (실행 → 평가 → 분석 → 개선 → 재평가)</text><rect x="30" y="70" width="250" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="155.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">① 실행</text><text x="155.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">문항(case_id)을 하나씩</text><text x="155.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">Agent 파이프라인 실행</text><text x="155.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">같은 질문 · 같은 PDF 범위</text><rect x="340" y="70" width="250" height="120" rx="10" fill="#F1EAFB" stroke="#8B5CF6" stroke-width="2"/><text x="465.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">② 실행 기록 저장</text><text x="465.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">PostgreSQL, experiment_id로 연결</text><text x="465.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">답변 · 인용 · 검색 청크 · trace</text><text x="465.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">호출 수 · 토큰 · 시간</text><rect x="650" y="70" width="250" height="120" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="775.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">③ RAG Agent 평가</text><text x="775.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">03_answers · 골