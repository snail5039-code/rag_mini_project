<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#4B5563"/></marker></defs><rect width="1200" height="690" fill="#FFFFFF"/><text x="40" y="38" font-size="21" font-weight="bold" text-anchor="start" fill="#1F2937">③ 기록 · 평가 루프 (실행 → 평가 → 분석 → 개선 → 재평가)</text><rect x="30" y="70" width="250" height="120" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="155.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">① 실행</text><text x="155.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">문항(case_id)을 하나씩</text><text x="155.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">Agent 파이프라인 실행</text><text x="155.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">같은 질문 · 같은 PDF 범위</text><rect x="340" y="70" width="250" height="120" rx="10" fill="#F1EAFB" stroke="#8B5CF6" stroke-width="2"/><text x="465.0" y="106.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">② 실행 기록 저장</text><text x="465.0" y="130.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">JSON/DB, experiment_id로 연결</text><text x="465.0" y="149.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">답변 · 인용 · 검색 청크 · trace</text><text x="465.0" y="168.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">호출 수 · 토큰 · 시간</text><rect x="650" y="70" width="250" height="120" rx="10" fill="#FFF1E0" stroke="#F08C1A" stroke-width="2"/><text x="775.0" y="116.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">③ 평가 (별도 담당)</text><text x="775.0" y="140.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">03_answers · 골든셋과 비교</text><text x="775.0" y="159.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">아래 4축으로 채점</text><path d="M 280 130 L 340 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 590 130 L 650 130" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 775 190 L 775 235" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="30" y="235" width="240" height="100" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="150.0" y="271.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">검색 지표</text><text x="150.0" y="295.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">Hit@k · Recall@k · MRR</text><text x="150.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">child 단계 + parent 단계</text><rect x="330" y="235" width="240" height="100" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="450.0" y="271.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">답변 품질</text><text x="450.0" y="295.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">must_include / must_not_include</text><text x="450.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">LLM Judge · 인용 검사</text><rect x="630" y="235" width="240" height="100" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="750.0" y="271.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">응답 유형 (negative)</text><text x="750.0" y="295.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">되묻기 · 보류 · 거절 · 정정이</text><text x="750.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">문항의 기대 행동과 맞는가</text><rect x="930" y="235" width="240" height="100" rx="10" fill="#E7F6EC" stroke="#22A06B" stroke-width="2"/><text x="1050.0" y="271.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">운영 지표</text><text x="1050.0" y="295.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">지연 시간 · 모델 호출 수</text><text x="1050.0" y="314.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">검색 횟수 · 토큰</text><rect x="30" y="380" width="1140" height="40" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="600.0" y="405.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">④ 실패 분석 — 검색 실패와 생성 실패를 구분</text><path d="M 150 335 L 150 358" stroke="#4B5563" stroke-width="2" fill="none"/><path d="M 450 335 L 450 358" stroke="#4B5563" stroke-width="2" fill="none"/><path d="M 750 335 L 750 358" stroke="#4B5563" stroke-width="2" fill="none"/><path d="M 1050 335 L 1050 358" stroke="#4B5563" stroke-width="2" fill="none"/><path d="M 150 358 L 1050 358" stroke="#4B5563" stroke-width="2" fill="none"/><path d="M 600 358 L 600 380" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 210 420 L 210 450" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 600 420 L 600 450" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 990 420 L 990 450" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><rect x="30" y="450" width="360" height="90" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="210.0" y="481.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">검색 실패</text><text x="210.0" y="505.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">근거(source_ids)를 못 찾음</text><text x="210.0" y="524.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 청킹 · 검색 설정 조정</text><rect x="420" y="450" width="360" height="90" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="600.0" y="481.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">판단 실패</text><text x="600.0" y="505.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">근거는 있었는데 '부족'으로 판단 (또는 반대)</text><text x="600.0" y="524.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 충분성 판단 기준 조정</text><rect x="810" y="450" width="360" height="90" rx="10" fill="#FDECEC" stroke="#DC4C4C" stroke-width="2"/><text x="990.0" y="481.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">생성 실패</text><text x="990.0" y="505.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">근거를 찾았지만 답변이 틀림</text><text x="990.0" y="524.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">→ 프롬프트 · 답변 Agent 조정</text><rect x="30" y="580" width="1140" height="70" rx="10" fill="#E8F1FD" stroke="#3B82F6" stroke-width="2"/><text x="600.0" y="610.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">⑤ 개선 → 재평가</text><text x="600.0" y="634.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#1F2937">기준 설정 대비 한 요소만 변경 → 새 experiment_id → 같은 질문으로 다시 실행</text><path d="M 210 540 L 210 580" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 600 540 L 600 580" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 990 540 L 990 580" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/><path d="M 30 615 L 12 615 L 12 130 L 30 130" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/></svg>